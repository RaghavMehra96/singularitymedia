<style>
/* Layout: one screen. Wordmark centred over a starfield, email beneath, black-hole horizon rising from the bottom edge. */
:root{
  --space:#0A0A0A;
  --hairline:#262626;
  --starlight:#F5F5F3;
  --starlight-muted:#8F8F8F;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
.page{min-height:100%;display:flex;flex-direction:column}
body{margin:0;background:var(--space);color:var(--starlight);-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{position:relative;flex:1;min-height:560px;display:grid;place-items:center;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:96px 220px}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block}
.horizon{position:absolute;left:50%;bottom:0;width:min(1400px,220vw);aspect-ratio:2/1;transform:translate(-50%,40%);pointer-events:none}
.horizon svg{width:100%;height:100%;overflow:visible}
.horizon .glow{fill:none;stroke:var(--starlight);stroke-width:40;opacity:.06;filter:url(#soft)}
.horizon .void{fill:var(--space)}
.horizon .halo{fill:none;stroke:var(--starlight);stroke-width:1.2;opacity:.28;stroke-dasharray:1260;animation:draw 2200ms var(--ease) 300ms both}
.horizon .photon{fill:none;stroke:var(--starlight);stroke-width:.6;opacity:.14}
.horizon .disc{fill:var(--starlight);opacity:.5;transform-origin:700px 350px;animation:sweep 1800ms var(--ease) 800ms both}
.horizon .disc-glow{fill:var(--starlight);opacity:.10;filter:url(#soft);transform-origin:700px 350px;animation:sweep 1800ms var(--ease) 800ms both}
.content{position:relative;display:grid;justify-items:center;gap:clamp(48px,7vw,88px);text-align:center;width:100%}
.wordmark{width:min(720px,100%);height:auto;display:block;animation:rise 1400ms var(--ease) both}
.mail{font-family:var(--font-mono);font-size:14px;letter-spacing:.06em;color:var(--starlight);text-decoration:none;border-bottom:1px solid var(--hairline);padding-bottom:4px;overflow-wrap:anywhere;transition:border-color 180ms var(--ease)}
.mail:hover{border-color:var(--starlight-muted)}
.copy{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--starlight-muted);background:none;border:0;padding:6px 8px;cursor:pointer;transition:color 180ms var(--ease)}
.copy:hover{color:var(--starlight)}
footer{position:relative;border-top:1px solid var(--hairline);background:var(--space)}
.foot{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 40px;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.foot{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.small{font-family:var(--font-mono);font-size:12px;line-height:18px;letter-spacing:.06em;color:var(--starlight-muted)}
.label{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--starlight-muted)}
.reach{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
:focus-visible{outline:2px solid var(--starlight);outline-offset:3px}
@keyframes draw{from{stroke-dashoffset:1260}to{stroke-dashoffset:0}}
@keyframes sweep{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>

<script>
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d'),stars=[],still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function seed(){
    var r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);
    var n=Math.round(r.width*r.height/2600);stars=[];
    for(var i=0;i<n;i++)stars.push({x:Math.random()*r.width,y:Math.random()*r.height,r:Math.random()<.92?Math.random()*.8+.3:Math.random()*.6+1.1,a:Math.random()*.55+.15,p:Math.random()*6.28,s:Math.random()*.6+.2});
    draw(0);
  }
  function draw(t){
    var r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#F5F5F3';
    for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=still?s.a:s.a*(.65+.35*Math.sin(t*.001*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
    ctx.globalAlpha=1;
  }
  seed();window.addEventListener('resize',seed);
  if(!still){(function loop(t){draw(t);requestAnimationFrame(loop);})(0);}
  var btn=document.getElementById('copy'),mail=document.getElementById('mail');
  btn.addEventListener('click',function(){
    var t=mail.textContent.trim();
    var done=function(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy';},2000);};
    var fail=function(){var r=document.createRange();r.selectNodeContents(mail);var s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected';setTimeout(function(){btn.textContent='Copy';},2000);};
    try{navigator.clipboard.writeText(t).then(done,fail);}catch(e){fail();}
  });
})();
</script>
